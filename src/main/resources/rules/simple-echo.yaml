name: Simple Echo
startingState: wait

properties:
  - type: INT
    key: echoDelay
    label: "Echo Delay (Ticks):"
    defaultValue: 4
    min: 1
    max: 64
    step: 1
  - type: INT
    key: dropInterval
    label: "Pitch Drop (Semitones):"
    defaultValue: 7
    min: 0
    max: 24
    step: 1

states:
  wait:
    type: DELAYED_TRANSITION
    delay: "$echoDelay"
    wrappedState: echoNote

  echoNote:
    type: ALWAYS_TRANSITION
    actions:
      - type: PLAY_CHORD_DOWN_INTERVAL
        params:
          interval: "$dropInterval"
    nextState: wait
