name: Crescendo Wave
startingState: buildPhase

properties:
  - type: INT
    key: phraseTicks
    label: "Phrase Length (Ticks):"
    defaultValue: 8
    min: 1
    max: 128
    step: 1
  - type: INT
    key: velocityStep
    label: "Velocity Step:"
    defaultValue: 12
    min: 1
    max: 40
    step: 1

states:
  buildPhase:
    type: DELAYED_TRANSITION
    delay: "$phraseTicks"
    wrappedState: loudStep

  loudStep:
    type: ALWAYS_TRANSITION
    actions:
      - type: PLAY_CHORD_UP_VELOCITY
        params:
          delta: "$velocityStep"
    nextState: fadePhase

  fadePhase:
    type: DELAYED_TRANSITION
    delay: "$phraseTicks"
    wrappedState: softStep

  softStep:
    type: ALWAYS_TRANSITION
    actions:
      - type: PLAY_CHORD_DOWN_VELOCITY
        params:
          delta: "$velocityStep"
    nextState: buildPhase
