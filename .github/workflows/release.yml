name: Build and Release JavaFX App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            type: exe
            icon: src/main/resources/icon.ico
          - os: macos-latest
            type: dmg
            icon: src/main/resources/icon.icns
          - os: ubuntu-latest
            type: deb
            icon: src/main/resources/icon.png

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package

      - name: Prepare jpackage input
        run: cp target/*.jar target/libs/

      - name: Package native installer
        run: |
          jpackage \
            --input target/libs \
            --name "MARGIA" \
            --main-jar margia.jar \
            --main-class org.roach.margia.main.Main \
            --type ${{ matrix.type }} \
            --icon ${{ matrix.icon }} \
            --app-version ${GITHUB_REF_NAME#v} \
            --dest target/dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/dist/*
